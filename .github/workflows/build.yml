name: Build

on:
  push:
  pull_request:
  schedule:
    # Daily run against the newest CraftEngine snapshot to catch upstream API churn early.
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (CraftEngine ${{ matrix.craftengine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        craftengine: [pinned, latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve newest CraftEngine snapshot
        if: matrix.craftengine == 'latest'
        run: |
          version=$(curl -fsSL https://repo.momirealms.net/snapshots/net/momirealms/craft-engine-core/maven-metadata.xml \
            | grep -oP '(?<=<version>)[^<]+(?=</version>)' | sort -V | tail -n 1)
          echo "Newest CraftEngine snapshot: $version"
          echo "CE_ARGS=-Pcraftengine_version=$version" >> "$GITHUB_ENV"

      # MachineEngine comes from JitPack (gradle/libs.versions.toml): there is no checkout next to this one.
      - name: Build and test
        run: ./gradlew build ${CE_ARGS:-} --console=plain

      - name: Upload plugin jar
        if: matrix.craftengine == 'pinned'
        uses: actions/upload-artifact@v4
        with:
          name: Mekanized
          path: build/libs/Mekanized-*.jar
