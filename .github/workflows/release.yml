name: Release

# Push a tag named like the version (0.1.0, 0.2.0-beta.1) to release it: the plugin jar is built with
# that version, attached to a GitHub release, and uploaded to Hangar. It builds against the
# MachineEngine tag named in gradle/libs.versions.toml, which must exist first.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == '1robie/Mekanized'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Releases come from main only (MachineEngine D48): a tag pushed on develop publishes nothing.
      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::Tag $VERSION is not on main. Merge develop into main first, then tag main."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      # MachineEngine at the version in gradle/libs.versions.toml, next to this checkout: the build
      # uses it instead of JitPack (settings.gradle.kts), so a JitPack outage cannot block a build.
      - name: MachineEngine checkout
        run: |
          version=$(grep -oP '^machineengine = "\K[^"]+' gradle/libs.versions.toml)
          git clone --quiet --depth 1 --branch "$version" https://github.com/1robie/MachineEngine.git ../MachineEngine

      - name: Build and test
        run: ./gradlew build -Pversion="$VERSION" --console=plain

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$VERSION" "build/libs/Mekanized-$VERSION.jar" \
            --title "Mekanized $VERSION" --generate-notes $prerelease

      - name: Hangar
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew publishPluginPublicationToHangar -Pversion="$VERSION" --console=plain
