name: Hangar page

# Keeps the Hangar project page (https://hangar.papermc.io/1robie/Mekanized) equal to the README.
# The HANGAR_API_TOKEN key needs the edit_page permission.
on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == '1robie/Mekanized'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync the README to Hangar
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew syncAllPluginPublicationPagesToHangar --console=plain
