group=fr.robie
version=0.1.0-SNAPSHOT

# CraftEngine: compile against the same dev snapshot as MachineEngine.
craftengine_version=26.10-SNAPSHOT
# Git ref built by buildCraftEngineDev for dev servers.
craftengine_dev_ref=dev
# Runtime CraftEngine for dev servers: "dev" (jar built from craftengine_dev_ref) or "modrinth".
craftengine_runtime=dev
craftengine_modrinth_version=26.9.2

# Hangar (release workflow): the Paper versions a release is listed for, as Hangar takes them
# (ranges like 1.20.6-26.3, wildcards like 1.21.x). Folia is the project's "Supports Folia" tag.
hangar_paper_versions=1.20.6-26.3

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
