# Mekanized settings. Read when the server starts: restart to apply changes.
# Defaults are Mekanism's. Recipes (durations, energy per tick, outputs) are edited in
# plugins/MachineEngine/definitions/mekanized/ instead, and reload with the server's recipes.

# How much a network moves per tick, per tier: [basic, advanced, elite, ultimate].
transport:
  universal-cable: [8000, 128000, 1024000, 8192000]       # Joules per tick
  pressurized-tube: [750, 2000, 64000, 256000]            # mB per tick
  mechanical-pipe: [250, 1000, 8000, 32000]               # mB per tick
  logistical-transporter: [8, 16, 32, 64]                 # items every 10 ticks

dynamic-tank:
  fluid-per-block: 350000         # mB of fluid per block inside the tank
  chemical-per-block: 16000000    # mB of chemical per block inside the tank

thermal-evaporation:
  input-per-level-per-tick: 10    # mB of input evaporated per tick per level, by day (half at night, half again in rain)
  input-tank-per-level: 16000     # mB of input the tower holds per level

# The teleporter and the portable teleporter. Costs are Joules; defaults are Mekanism's.
teleporter:
  base-cost: 1000           # J of any teleport
  cost-per-block: 10        # J more per block travelled in one world
  other-world-cost: 100000  # J of a teleport to another world (distance does not count)
  cooldown-seconds: 3       # seconds a player waits between two teleports

# The dimensional stabilizer. Anchor upgrades always load only the machine's own chunk, for free.
chunk-loading:
  max-radius: 2          # chunks around its own a stabilizer can load (0-8); 2 is a 5 x 5 area
  energy-per-chunk: 500  # J per tick for each chunk it keeps loaded

# Radiation (Mekanism's, simplified). Dose and radiation are in Sieverts (Sv, Sv/h).
radiation:
  background: 0.0000001             # Sv/h everywhere
  source-decay-per-second: 0.995    # a released source keeps this much of its strength each second (0.5-1; half-life about 2.3 minutes)
  min-source: 0.000001              # Sv/h below which a source is forgotten
  dose-decay-per-second: 0.999      # a player's dose keeps this much each second (0.5-1; half-life about 11 minutes)
  shielding-per-piece: 0.25         # share of radiation each hazmat piece (or MekaSuit piece with a shielding unit) stops (0-0.25)
  sickness-dose: 1                  # Sv from which players get hungry
  damage-dose: 10                   # Sv from which players get nauseous, weak and hurt
  lethal-dose: 100                  # Sv from which every second does heavy damage
  barrel-capacity: 512000           # mB a radioactive waste barrel holds (a restart rebuilds the machine)
  barrel-decay-per-second: 1        # mB that decay in a barrel each second

# The digital miner.
digital-miner:
  energy-per-block: 2000   # J per block mined
  ticks-per-block: 10      # ticks per block mined (speed upgrades shorten it)
  scan-per-tick: 2048      # positions it looks at per tick for the next block to mine
  max-radius: 32           # widest radius (1-128); 32 is a 65 x 65 area

# The QIO network. Lists are for the drives: [base, hyper-dense, time-dilating, supermassive].
qio:
  drive-items: [16000, 128000, 1048000, 16000000]  # items each drive holds
  drive-kinds: [128, 256, 1024, 8192]              # kinds of item each drive holds
  array-kinds: 1024                                # kinds of item a drive array holds at most, whatever its drives (1-16384)
  importer-exporter-rate: 64                       # items an importer or exporter moves per second

# Gear: tools, suits, packs and modules. Energy is in Joules, chemicals in mB.
gear:
  # Joules each item holds when full. free-runners also covers the armored ones; mekasuit covers all four pieces.
  energy-capacity:
    energy-tablet: 1000000
    atomic-disassembler: 1000000
    portable-teleporter: 1000000
    meka-tool: 16000000
    electric-bow: 120000
    free-runners: 64000
    mekasuit: 16000000
  energy-unit-factor: 4      # an energy unit multiplies a piece's capacity by this
  # mB of chemical each item holds. jetpack also covers the armored jetpack and the MekaSuit body armor.
  chemical-capacity:
    jetpack: 24000
    flamethrower: 24000
    scuba-tank: 24000
    canteen: 64000
  scuba-oxygen-per-second: 20  # mB of oxygen each time the tank refills the player's air
  tools:
    energy-per-block: 100                # J per block mined (and the charge a disassembler or Meka-Tool needs to mine fast)
    vein-limit: 64                       # blocks one vein mining breaks (sneaking)
    vein-limit-with-unit: 256            # the same with the vein mining unit
    shear-energy: 500                    # J per animal sheared
    disassembler-hit-energy: 2000        # J per hit of a charged atomic disassembler
    disassembler-damage: 20              # damage it deals at least (20 is ten hearts)
    meka-tool-hit-energy: 3000           # J per hit of a charged Meka-Tool
    meka-tool-damage: 10                 # damage it deals at least
    meka-tool-amplified-damage: 30       # the same with the attack amplification unit
    bow-energy-per-shot: 120             # J per shot of the electric bow
    teleport-range: 100                  # blocks the teleportation unit looks ahead (1-256); its cost is under teleporter
    flamethrower-hydrogen: 5             # mB of hydrogen per burst
    flamethrower-damage: 2               # damage of a burst
  jetpack:
    hydrogen-per-tick: 1       # mB of hydrogen per tick of thrust
    thrust: 0.15               # upward speed added each tick
    max-speed: 0.5             # top upward speed
    walk-speed: 0.3            # horizontal speed steered with the movement keys
    sprint-speed: 0.45         # the same while sprinting
  modules:                     # J per second unless said otherwise
    fall-energy-per-damage: 50              # J per point of fall damage absorbed (free runners, MekaSuit boots)
    magnetic-attraction-energy: 20          # J per item pulled
    magnetic-attraction-range: 8            # blocks
    electrolytic-breathing-energy: 2000
    vision-enhancement-energy: 200
    nutritional-injection-energy: 2500
    inhalation-purification-energy: 2000    # per harmful effect removed
    gravitational-modulating-energy: 20000  # while flying; the charge needed to start flying
    locomotive-boosting-energy: 2000
    hydraulic-propulsion-energy: 200
    hydrostatic-repulsor-energy: 500
    gyroscopic-stabilization-energy: 200
    motorized-servo-min-energy: 100         # the charge the legs need to step up blocks
    solar-recharging-energy: 2000           # J made per second in daylight
    geothermal-generator-energy: 10000      # J made per second in lava or on fire
    charge-distribution-energy: 20000       # J given to each other piece per second

# Menu colors of chemicals and fluids: resource (e.g. steam, or fluid/brine for a fluid) to "#RRGGBB".
# Empty: Mekanism's colors. Restart to apply.
colors: {}
