# Mekanized settings. Read when the server starts: restart to apply changes.
# Defaults are Mekanism's. Recipes (durations, energy per tick, outputs) are edited in
# plugins/MachineEngine/definitions/mekanized/ instead, and reload with the server's recipes.
# Missing settings are added with their defaults when the server starts.

# The teleporter and the portable teleporter. Costs are Joules; defaults are Mekanism's.
teleporter:
  # J of any teleport
  base-cost: 1000
  # J more per block travelled in one world
  cost-per-block: 10
  # J of a teleport to another world (distance does not count)
  other-world-cost: 100000
  # seconds a player waits between two teleports
  cooldown-seconds: 3.0

# The dimensional stabilizer. Anchor upgrades always load only the machine's own chunk, for free.
chunk-loading:
  # chunks around its own a stabilizer can load (0-8); 2 is a 5 x 5 area
  max-radius: 2

# Radiation (Mekanism's, simplified). Dose and radiation are in Sieverts (Sv, Sv/h).
radiation:
  # Sv/h everywhere
  background: 1.0E-7
  # a released source keeps this much of its strength each second (0.5-1; half-life about 2.3 minutes)
  source-decay-per-second: 0.995
  # Sv/h below which a source is forgotten
  min-source: 1.0E-6
  # a player's dose keeps this much each second (0.5-1; half-life about 11 minutes)
  dose-decay-per-second: 0.999
  # Sv from which players get hungry
  sickness-dose: 1.0
  # Sv from which players get nauseous, weak and hurt
  damage-dose: 10.0
  # Sv from which every second does heavy damage
  lethal-dose: 100.0

# The digital miner.
digital-miner:
  # positions it looks at per tick for the next block to mine
  scan-per-tick: 2048
  # widest radius (1-128); 32 is a 65 x 65 area
  max-radius: 32

# The QIO network. What each drive holds is in its item config, an importer's or exporter's rate in its block config.
qio:
  # kinds of item a drive array holds at most, whatever its drives (1-16384)
  array-kinds: 1024
