# Mekanized settings. Read when the server starts: restart to apply changes.
# Defaults are Mekanism's. Recipes (durations, energy per tick, outputs) are edited in
# plugins/MachineEngine/definitions/mekanized/ instead, and reload with the server's recipes.
# Missing settings are added with their defaults when the server starts.

# How much a network moves per tick, per tier: [basic, advanced, elite, ultimate].
transport:
  # Joules per tick
  universal-cable:
  - 8000
  - 128000
  - 1024000
  - 8192000
  # mB per tick
  pressurized-tube:
  - 750
  - 2000
  - 64000
  - 256000
  # mB per tick
  mechanical-pipe:
  - 250
  - 1000
  - 8000
  - 32000
  # items every 10 ticks
  logistical-transporter:
  - 8
  - 16
  - 32
  - 64

dynamic-tank:
  # mB of fluid per block inside the tank
  fluid-per-block: 350000
  # mB of chemical per block inside the tank
  chemical-per-block: 16000000

thermal-evaporation:
  # mB of input evaporated per tick per level, by day (half at night, half again in rain)
  input-per-level-per-tick: 10
  # mB of input the tower holds per level
  input-tank-per-level: 16000

# The teleporter and the portable teleporter. Costs are Joules; defaults are Mekanism's.
teleporter:
  # J of any teleport
  base-cost: 1000
  # J more per block travelled in one world
  cost-per-block: 10
  # J of a teleport to another world (distance does not count)
  other-world-cost: 100000
  # seconds a player waits between two teleports
  cooldown-seconds: 3.0

# The dimensional stabilizer. Anchor upgrades always load only the machine's own chunk, for free.
chunk-loading:
  # chunks around its own a stabilizer can load (0-8); 2 is a 5 x 5 area
  max-radius: 2
  # J per tick for each chunk it keeps loaded
  energy-per-chunk: 500

# Radiation (Mekanism's, simplified). Dose and radiation are in Sieverts (Sv, Sv/h).
radiation:
  # Sv/h everywhere
  background: 1.0E-7
  # a released source keeps this much of its strength each second (0.5-1; half-life about 2.3 minutes)
  source-decay-per-second: 0.995
  # Sv/h below which a source is forgotten
  min-source: 1.0E-6
  # a player's dose keeps this much each second (0.5-1; half-life about 11 minutes)
  dose-decay-per-second: 0.999
  # Sv from which players get hungry
  sickness-dose: 1.0
  # Sv from which players get nauseous, weak and hurt
  damage-dose: 10.0
  # Sv from which every second does heavy damage
  lethal-dose: 100.0
  # mB a radioactive waste barrel holds (a restart rebuilds the machine)
  barrel-capacity: 512000
  # mB that decay in a barrel each second
  barrel-decay-per-second: 1

# The digital miner.
digital-miner:
  # J per block mined
  energy-per-block: 2000
  # ticks per block mined (speed upgrades shorten it)
  ticks-per-block: 10
  # positions it looks at per tick for the next block to mine
  scan-per-tick: 2048
  # widest radius (1-128); 32 is a 65 x 65 area
  max-radius: 32

# The QIO network. Lists are for the drives: [base, hyper-dense, time-dilating, supermassive].
qio:
  # items each drive holds
  drive-items:
  - 16000
  - 128000
  - 1048000
  - 16000000
  # kinds of item each drive holds
  drive-kinds:
  - 128
  - 256
  - 1024
  - 8192
  # kinds of item a drive array holds at most, whatever its drives (1-16384)
  array-kinds: 1024
  # items an importer or exporter moves per second
  importer-exporter-rate: 64
