blocks:
  mekanized:pressurized_reaction_chamber:
    behavior:
      type: machineengine:machine
      machine: mekanized:pressurized_reaction_chamber
      keep_contents: true
      display_item: mekanized:display/pressurized_reaction_chamber
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
    loot:
      template: machineengine:loot_table/keep_contents
    settings:
      template: default:settings/transparent_1x1x1
      overrides:
        hardness: 3.5
        resistance: 8.0
        push_reaction: block
        tags:
        - minecraft:mineable/pickaxe
        correct_tools:
        - '#minecraft:pickaxes'
        required_break_power: 1
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_models_pressurized_reaction_chamber_elements
          model:
            path: mekanized:block/display_empty/shared/p_block_models_pressurized_reaction_chamber_elements
      variants:
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=east:
          appearance: default
        facing=west:
          appearance: default
