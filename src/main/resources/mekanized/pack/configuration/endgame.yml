# Mekanized late-game machines and generators (Phase 6), based on Mekanism (MIT).
items:
  mekanized:display/pressurized_reaction_chamber:
    model: mekanized:block/pressurized_reaction_chamber
  mekanized:pressurized_reaction_chamber:
    template: mekanized:item/block_item
  mekanized:display/isotopic_centrifuge:
    model: mekanized:block/isotopic_centrifuge
  mekanized:isotopic_centrifuge:
    template: mekanized:item/block_item
  mekanized:display/solar_neutron_activator:
    model: mekanized:block/solar_neutron_activator
  mekanized:display/solar_neutron_activator/active:
    model: mekanized:block/solar_neutron_activator_active
  mekanized:solar_neutron_activator:
    template: mekanized:item/block_item
  mekanized:display/antiprotonic_nucleosynthesizer:
    model: mekanized:block/antiprotonic_nucleosynthesizer
  mekanized:antiprotonic_nucleosynthesizer:
    template: mekanized:item/block_item
  mekanized:display/painting_machine:
    model: mekanized:block/painting_machine
  mekanized:display/painting_machine/active:
    model: mekanized:block/painting_machine_active
  mekanized:painting_machine:
    template: mekanized:item/block_item
  mekanized:display/pigment_extractor:
    model: mekanized:block/pigment_extractor
  mekanized:display/pigment_extractor/active:
    model: mekanized:block/pigment_extractor_active
  mekanized:pigment_extractor:
    template: mekanized:item/block_item
  mekanized:display/pigment_mixer:
    model: mekanized:block/pigment_mixer
  mekanized:display/pigment_mixer/active:
    model: mekanized:block/pigment_mixer_active
  mekanized:pigment_mixer:
    template: mekanized:item/block_item
  mekanized:display/gas_burning_generator:
    model: mekanized:block/gas_burning_generator
  mekanized:gas_burning_generator:
    template: mekanized:item/block_item
  mekanized:display/wind_generator:
    model: mekanized:block/wind_generator
  mekanized:wind_generator:
    template: mekanized:item/block_item
  mekanized:display/advanced_solar_generator:
    model: mekanized:block/advanced_solar_generator
  mekanized:advanced_solar_generator:
    template: mekanized:item/block_item
blocks:
  mekanized:pressurized_reaction_chamber:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_pressurized_reaction_chamber_elements
      display_model: mekanized:block/display_empty/shared/p_block_models_pressurized_reaction_chamber_elements
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:isotopic_centrifuge:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_isotopic_centrifuge
      display_model: mekanized:block/display_empty/shared/p_block_models_isotopic_centrifuge
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:solar_neutron_activator:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_solar_neutron_activator1
      display_model: mekanized:block/display_empty/shared/p_block_models_solar_neutron_activator1
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:antiprotonic_nucleosynthesizer:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_antiprotonic_nucleosynthesizer_front
      display_model: mekanized:block/display_empty/shared/p_block_models_antiprotonic_nucleosynthesizer_front
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:painting_machine:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_painting_machine_right
      display_model: mekanized:block/display_empty/shared/p_block_painting_machine_right
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:pigment_extractor:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_pigment_extractor_right
      display_model: mekanized:block/display_empty/shared/p_block_pigment_extractor_right
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:pigment_mixer:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_pigment_mixer_base
      display_model: mekanized:block/display_empty/shared/p_block_pigment_mixer_base
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:gas_burning_generator:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_model_gas_burning_generator
      display_model: mekanized:block/display_empty/shared/p_block_model_gas_burning_generator
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:wind_generator:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_steel_casing
      display_model: mekanized:block/display_empty/shared/p_block_steel_casing
    behavior:
      options:
        max-energy-per-tick: 480
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:advanced_solar_generator:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_model_advanced_solar_generator
      display_model: mekanized:block/display_empty/shared/p_block_model_advanced_solar_generator
    behavior:
      options:
        energy-per-tick: 300
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270