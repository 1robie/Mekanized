blocks:
  mekanized:chemical_oxidizer:
    template: machineengine:block/machine
    behavior:
      display_item: mekanized:display/chemical_oxidizer
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
    settings:
      template: mekanized:settings/transparent_machine
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_models_chemical_oxidizer
          model:
            path: mekanized:block/display_empty/shared/p_block_models_chemical_oxidizer
      variants:
        facing=north:
