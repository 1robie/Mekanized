# Mekanized chemical machines, tanks, tubes, pipes and the pump (Phase 3), based on Mekanism (MIT).
items:
  mekanized:display/chemical_oxidizer:
    model: mekanized:block/chemical_oxidizer
  mekanized:chemical_oxidizer:
    template: mekanized:item/block_item
  mekanized:display/chemical_infuser:
    model: mekanized:block/chemical_infuser
  mekanized:chemical_infuser:
    template: mekanized:item/block_item
  mekanized:chemical_injection_chamber:
    template: mekanized:item/block_item
  mekanized:display/chemical_dissolution_chamber:
    model: mekanized:block/chemical_dissolution_chamber
  mekanized:chemical_dissolution_chamber:
    template: mekanized:item/block_item
  mekanized:display/chemical_washer:
    model: mekanized:block/chemical_washer
  mekanized:chemical_washer:
    template: mekanized:item/block_item
  mekanized:display/chemical_crystallizer:
    model: mekanized:block/chemical_crystallizer
  mekanized:chemical_crystallizer:
    template: mekanized:item/block_item
  mekanized:display/electrolytic_separator:
    model: mekanized:block/electrolytic_separator
  mekanized:electrolytic_separator:
    template: mekanized:item/block_item
  mekanized:display/rotary_condensentrator:
    model: mekanized:block/rotary_condensentrator
  mekanized:rotary_condensentrator:
    template: mekanized:item/block_item
  mekanized:display/electric_pump:
    model: mekanized:block/electric_pump
  mekanized:electric_pump:
    template: mekanized:item/block_item
  mekanized:electrolytic_core:
    template: mekanized:item/generated
  mekanized:energy_tablet:
    template: mekanized:item/generated
    behaviors:
    - type: machineengine:energy_item
      max-energy: 1000000
    client-bound-data:
      mekanized:gear_lore: {}
      machineengine:resource_lore: {}
blocks:
  mekanized:chemical_oxidizer:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_chemical_oxidizer
      display_model: mekanized:block/display_empty/shared/p_block_models_chemical_oxidizer
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:chemical_infuser:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_chemical_infuser
      display_model: mekanized:block/display_empty/shared/p_block_models_chemical_infuser
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:chemical_injection_chamber:
    template: mekanized:block/machine_facing_active
  mekanized:chemical_dissolution_chamber:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_bottom
      display_model: mekanized:block/display_empty/shared/p_block_bottom
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:chemical_washer:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_steel_casing
      display_model: mekanized:block/display_empty/shared/p_block_steel_casing
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:chemical_crystallizer:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_chemical_crystallizer
      display_model: mekanized:block/display_empty/shared/p_block_models_chemical_crystallizer
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:electrolytic_separator:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_steel_casing
      display_model: mekanized:block/display_empty/shared/p_block_steel_casing
    behavior:
      display_rotation: 90
      display_rotations: north=0/90,south=0/270,east=0/180,west=0/0
  mekanized:rotary_condensentrator:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_rotary_condensentrator
      display_model: mekanized:block/display_empty/shared/p_block_models_rotary_condensentrator
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:electric_pump:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_steel_casing
      display_model: mekanized:block/display_empty/shared/p_block_steel_casing
    behavior:
      options:
        energy: 2000
        ticks: 20
        range: 32
        heavy-water-per-block: 10
      display_rotation: 180
      display_rotations: north=0/180,south=0/0,east=0/270,west=0/90
# Pressurized tubes (chemicals) and mechanical pipes (fluids): one row per block. A row's rate is the block's (D34): what one block passes per tick.
# Each row makes the block, its item and the 4 parts display entities draw it with
# (mekanized:cable_part/<transport>/<part>, template mekanized:item/cable_part): shape is thin or
# thick, texture defaults to mekanized:block/models/multipart/<transport>. See docs/CABLE_ARMS_PLAN.md.
config_factory#chemistry_transports:
  instances:
  - transport: basic_pressurized_tube
    rate: 750
    shape: thin
  - transport: advanced_pressurized_tube
    rate: 2000
    shape: thin
  - transport: elite_pressurized_tube
    rate: 64000
    shape: thin
  - transport: ultimate_pressurized_tube
    rate: 256000
    shape: thin
  - transport: basic_mechanical_pipe
    rate: 250
    shape: thick
  - transport: advanced_mechanical_pipe
    rate: 1000
    shape: thick
  - transport: elite_mechanical_pipe
    rate: 8000
    shape: thick
  - transport: ultimate_mechanical_pipe
    rate: 32000
    shape: thick
  blueprint:
    items:
      mekanized:${transport}:
        data:
          item_name: <!i><lang:block.mekanized.${transport}>
        model: mekanized:block/cable_part/${transport}/center
        behavior:
          type: block_item
          block: mekanized:${transport}
      mekanized:cable_part/${transport}/center:
        template: mekanized:item/cable_part
        arguments:
          shape: ${shape}
          part: center
          texture: ${texture:-"mekanized:block/models/multipart/${transport}"}
      mekanized:cable_part/${transport}/arm:
        template: mekanized:item/cable_part
        arguments:
          shape: ${shape}
          part: arm
          texture: ${texture:-"mekanized:block/models/multipart/${transport}"}
      mekanized:cable_part/${transport}/arm_pull:
        template: mekanized:item/cable_part
        arguments:
          shape: ${shape}
          part: arm_pull
          texture: ${texture:-"mekanized:block/models/multipart/${transport}"}
      mekanized:cable_part/${transport}/arm_push:
        template: mekanized:item/cable_part
        arguments:
          shape: ${shape}
          part: arm_push
          texture: ${texture:-"mekanized:block/models/multipart/${transport}"}
    blocks:
      mekanized:${transport}:
        template: mekanized:block/transport
        behavior:
          rate: ${rate}

# Fluid tanks. One row per tier. A row's behavior holds that block's numbers (D34: storages,
# ports), merged into what the family template gives; the creative tier has none.
config_factory#fluid_tanks:
  instances:
  - tier: basic
    behavior:
      storages:
        fluid: { capacity: 32000 }
      ports:
        out: { rate: 1000 }
  - tier: advanced
    behavior:
      storages:
        fluid: { capacity: 64000 }
      ports:
        out: { rate: 4000 }
  - tier: elite
    behavior:
      storages:
        fluid: { capacity: 128000 }
      ports:
        out: { rate: 16000 }
  - tier: ultimate
    behavior:
      storages:
        fluid: { capacity: 256000 }
      ports:
        out: { rate: 64000 }
  - tier: creative
    behavior: {}
  blueprint:
    items:
      mekanized:${tier}_fluid_tank:
        data:
          item_name: <!i><lang:block.mekanized.${tier}_fluid_tank>
        model: mekanized:block/fluid_tank
        behavior:
          type: block_item
          block: mekanized:${tier}_fluid_tank
      mekanized:display/${tier}_fluid_tank:
        model: mekanized:block/fluid_tank
    blocks:
      mekanized:${tier}_fluid_tank:
        template: mekanized:block/fluid_tank
        behavior: ${behavior}

