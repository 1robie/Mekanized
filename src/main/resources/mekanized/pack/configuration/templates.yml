# Mekanized's CraftEngine templates, used by the block and item files next to this one.
# Rewritten at every start: do not edit (copy a template into your own pack under another name to
# change it, and point the blocks you want at the copy). See docs/CE_TEMPLATES_PLAN.md.
templates:
  # Block settings. Use: settings: { template: mekanized:settings/machine }
  # A block changes one value with overrides: settings: { template: ..., overrides: { resistance: 12.0 } }

  # A full machine block.
  mekanized:settings/machine:
    template: default:settings/solid_1x1x1
    overrides:
      hardness: 3.5
      resistance: 8.0
      push_reaction: block
      tags:
      - minecraft:mineable/pickaxe
      correct_tools:
      - '#minecraft:pickaxes'
      required_break_power: 1

  # A machine drawn by display entities, or a transport: it does not hide its neighbours' faces.
  mekanized:settings/transparent_machine:
    template: default:settings/transparent_1x1x1
    overrides:
      hardness: 3.5
      resistance: 8.0
      push_reaction: block
      tags:
      - minecraft:mineable/pickaxe
      correct_tools:
      - '#minecraft:pickaxes'
      required_break_power: 1

  # A block of a material (osmium block, bio fuel block, …).
  mekanized:settings/storage_block:
    template: default:settings/solid_1x1x1
    overrides:
      hardness: 5.0
      resistance: 6.0
      tags:
      - minecraft:mineable/pickaxe
      correct_tools:
      - '#minecraft:pickaxes'
      required_break_power: 1

  # A cable, tube, pipe, transporter or conductor. Invisible itself (all of them share one visual
  # state): display entities draw its parts, the items mekanized:cable_part/<id>/<part>
  # (center, arm, arm_pull, arm_push; template mekanized:item/cable_part).
  # Use: template: mekanized:block/transport, with behavior: { rate: ... } next to it.
  mekanized:block/transport:
    template: machineengine:block/transport
    behavior:
      connection_items: ${__NAMESPACE__}:cable_part/${__ID__}
    settings:
      template: mekanized:settings/transparent_machine
    state:
      auto_state:
        type: sapling
        id: mekanized_universal_cable
      model:
        path: mekanized:block/display_empty/universal_cable

  # Tiered storage drawn by display entities. Argument: tier (basic, ..., creative). A block's
  # numbers (storages, ports: D34) go next to the template, under behavior.

  # An energy cube: a frame, an energy core with 4 fill levels and a port on each output side
  # (the items mekanized:display/<id>, display/energy_core/<tier>/<1-4>, display/<id>/port/<side>).
  mekanized:block/energy_cube:
    template: mekanized:block/display_machine_facing_6
    arguments:
      display_state: mekanized_display_energy_cube
      display_model: mekanized:block/display_empty/shared/energy_cube
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270,up=270/0,down=90/0
      level_display: ${__NAMESPACE__}:display/energy_core/${tier}
      level_storage: energy
      level_steps: 4
      side_display: ${__NAMESPACE__}:display/${__ID__}/port

  # A chemical tank, turned by facing (the item mekanized:display/<id> draws it).
  mekanized:block/chemical_tank:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_chemical_tank
      display_model: mekanized:block/display_empty/shared/chemical_tank
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270

  # A fluid tank (the item mekanized:display/<id> draws it).
  mekanized:block/fluid_tank:
    template: machineengine:block/machine
    behavior:
      display_item: ${__NAMESPACE__}:display/${__ID__}
    settings:
      template: mekanized:settings/transparent_machine
    state:
      auto_state:
        type: leaves
        id: mekanized_display_fluid_tank
      model:
        path: mekanized:block/display_empty/shared/fluid_tank

  # A machine drawn by display entities (the item mekanized:display/<id>), turned by facing.
  # Arguments display_state and display_model: see machineengine:block_state/display_rendered_facing
  # (Mekanized shares one state per breaking-particle texture). A block that turns its display
  # adds behavior: { display_rotations: ... } next to the template.
  mekanized:block/display_machine_facing:
    template: machineengine:block/machine
    behavior:
      display_item: ${__NAMESPACE__}:display/${__ID__}
    settings:
      template: mekanized:settings/transparent_machine
    states:
      template: machineengine:block_state/display_rendered_facing

  # A machine drawn by display entities (the item mekanized:display/<id>), without facing.
  # Arguments as mekanized:block/display_machine_facing, and state_type (default leaves).
  mekanized:block/display_machine:
    template: machineengine:block/machine
    behavior:
      display_item: ${__NAMESPACE__}:display/${__ID__}
    settings:
      template: mekanized:settings/transparent_machine
    state:
      template: machineengine:block_state/display_rendered

  # Solid machines, with the model <namespace>:block/<id> unless the argument model says
  # otherwise (and active_model, default <namespace>:block/<id>_active, for those with `active`).
  mekanized:block/machine:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    state:
      template: machineengine:block_state/solid
  mekanized:block/machine_facing:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    states:
      template: machineengine:block_state/facing
  mekanized:block/machine_active:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    states:
      template: machineengine:block_state/active
  mekanized:block/machine_facing_active:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    states:
      template: machineengine:block_state/facing_active

  # As mekanized:block/display_machine_facing, turned by facing in all 6 directions.
  mekanized:block/display_machine_facing_6:
    template: machineengine:block/machine
    behavior:
      display_item: ${__NAMESPACE__}:display/${__ID__}
    settings:
      template: mekanized:settings/transparent_machine
    states:
      template: machineengine:block_state/display_rendered_facing_6

  # A block of a material: drops itself, one solid model (argument model, default
  # <namespace>:block/<id>).
  mekanized:block/storage_block:
    loot:
      template: default:loot_table/self
    settings:
      template: mekanized:settings/storage_block
    state:
      template: machineengine:block_state/solid

  # Items. Their names come from lang.yml (block.<namespace>.<id> or item.<namespace>.<id>).
  # Other keys (settings, behaviors, components, ...) go next to the template.

  # The item that places the block of the same id. Argument model (default <namespace>:block/<id>).
  mekanized:item/block_item:
    data:
      item_name: <!i><lang:block.${__NAMESPACE__}.${__ID__}>
    model: ${model:-"${__NAMESPACE__}:block/${__ID__}"}
    behavior:
      type: block_item
      block: ${__NAMESPACE__}:${__ID__}

  # A part of a transport, drawn by display entities: the model block/cable/shape/<shape>/<part>
  # with the transport's texture. The arm points north; the display turns it to each side.
  # Arguments: shape (thin, thick), part (center, arm, arm_pull, arm_push), texture (the center
  # texture; the side texture is <texture>_vertical).
  mekanized:item/cable_part:
    model:
      path: ${__NAMESPACE__}:block/${__ID__}
      generation:
        parent: mekanized:block/cable/shape/${shape}/${part}
        textures:
          center: ${texture}
          side: ${texture}_vertical

  mekanized:item/name:
    data:
      item_name: <!i><lang:item.${__NAMESPACE__}.${__ID__}>

  # Any other item. Argument model (default <namespace>:item/<id>).
  mekanized:item/named:
    template: mekanized:item/name
    model: ${model:-"${__NAMESPACE__}:item/${__ID__}"}

  mekanized:item/generated:
    template: mekanized:item/name
    model:
      path: ${__NAMESPACE__}:item/${__ID__}
      generation:
        parent: ${parent:-"minecraft:item/handheld"}
        textures:
          layer0: ${texture:-"${__NAMESPACE__}:item/${__ID__}"}

  mekanized:item/generated_2_layers:
    template: mekanized:item/generated
    model:
      generation:
        textures:
          layer1: ${layer1:-"${__NAMESPACE__}:item/${__ID__}${layer1_suffix:-_layer1}"}

  mekanized:item/generated_bow:
    template: mekanized:item/name
    material: bow
    textures:
      - ${texture:-"${__NAMESPACE__}:item/${__ID__}"}
      - ${texture2:-"${__NAMESPACE__}:item/${__ID__}_pulling_0"}
      - ${texture3:-"${__NAMESPACE__}:item/${__ID__}_pulling_1"}
      - ${texture4:-"${__NAMESPACE__}:item/${__ID__}_pulling_2"}

  mekanized:item/generated_elytra:
    template: mekanized:item/name
    material: elytra
    textures:
      - ${texture:-"${__NAMESPACE__}:item/${__ID__}"}
      - ${texture2:-"${__NAMESPACE__}:item/${__ID__}_broken"}
  # Menu textures (gui.yml, docs/MENU_TEXTURES_PLAN.md).

  # An image drawn in menu titles. Arguments: file (under textures/gui/, no .png), ascent, height
  # (default 18). Its top is at y 13 - ascent of the menu window.
  mekanized:gui/glyph:
    height: ${height:-18}
    ascent: ${ascent}
    font: mekanized:gui
    file: mekanized:gui/${file}.png

  # One cell of a fill bar at one level (models written by mekanized/tools/compose_menu_textures.py).
  # Arguments: shape, cell, level. A leather helmet carries the resource's color (dyed_color) to the
  # tinted faces, on 1.20.6 as on later clients; zMenu's dyed-color component only colors wearable
  # leather armor (not horse armor). Menus hide its dye and armor lines (flags HIDE_DYE, HIDE_ATTRIBUTES).
  mekanized:item/gui_bar:
    material: leather_helmet
    model:
      path: mekanized:gui/bar/${shape}/${cell}_${level}
      tints:
      - type: dye
        default: -1

  # A menu icon over a slot. Arguments: texture (under textures/gui/), size (18: covers the slot
  # frame, 14: Mekanism's small buttons).
  mekanized:item/gui_icon:
    model:
      path: ${__NAMESPACE__}:${__ID__}
      generation:
        parent: mekanized:gui/icon_${size:-18}
        textures:
          icon: mekanized:gui/${texture}
