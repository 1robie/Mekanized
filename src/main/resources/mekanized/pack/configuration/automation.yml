# Mekanized Digital Miner, seismic vibrator, teleporter, QIO and the cardboard box (Phase 6 wave 4), based on Mekanism (MIT).
items:
  mekanized:display/digital_miner:
    model: mekanized:block/digital_miner
  mekanized:digital_miner:
    template: mekanized:item/block_item
  mekanized:display/seismic_vibrator:
    model: mekanized:block/seismic_vibrator
  mekanized:seismic_vibrator:
    template: mekanized:item/block_item
    arguments:
      model: mekanized:item/seismic_vibrator
  mekanized:teleporter:
    template: mekanized:item/block_item
  mekanized:teleporter_frame:
    template: mekanized:item/block_item
  mekanized:display/qio_drive_array:
    model: mekanized:block/qio_drive_array_offline
  mekanized:qio_drive_array:
    template: mekanized:item/block_item
    arguments:
      model: mekanized:block/qio_drive_array_offline
  mekanized:display/qio_dashboard:
    model: mekanized:block/qio_dashboard_offline
  mekanized:display/qio_dashboard/active:
    model: mekanized:block/qio_dashboard
  mekanized:qio_dashboard:
    template: mekanized:item/block_item
  mekanized:display/qio_importer:
    model: mekanized:block/qio_importer_offline
  mekanized:display/qio_importer/active:
    model: mekanized:block/qio_importer
  mekanized:qio_importer:
    template: mekanized:item/block_item
  mekanized:display/qio_exporter:
    model: mekanized:block/qio_exporter_offline
  mekanized:display/qio_exporter/active:
    model: mekanized:block/qio_exporter
  mekanized:qio_exporter:
    template: mekanized:item/block_item
  mekanized:cardboard_box:
    behaviors:
    - type: mekanized:cardboard_box
    data:
      item_name: <!i><lang:block.mekanized.cardboard_box>
    model: mekanized:block/cardboard_box
  mekanized:teleportation_core:
    template: mekanized:item/generated
  mekanized:robit:
    template: mekanized:item/named
    arguments:
      model: mekanized:item/robit_transforms
  mekanized:seismic_reader:
    template: mekanized:item/generated
    behaviors:
    - type: mekanized:seismic_reader
  mekanized:qio_drive_base:
    template: mekanized:item/generated
    behaviors:
    - type: mekanized:qio_drive
      items: 16000
      kinds: 128
  mekanized:qio_drive_hyper_dense:
    template: mekanized:item/generated
    behaviors:
    - type: mekanized:qio_drive
      items: 128000
      kinds: 256
  mekanized:qio_drive_time_dilating:
    template: mekanized:item/generated
    behaviors:
    - type: mekanized:qio_drive
      items: 1048000
      kinds: 1024
  mekanized:qio_drive_supermassive:
    template: mekanized:item/generated
    behaviors:
    - type: mekanized:qio_drive
      items: 16000000
      kinds: 8192
  mekanized:cardboard_box_storage:
    behaviors:
    - type: mekanized:cardboard_box_storage
    data:
      item_name: <!i><lang:block.mekanized.cardboard_box>
    model: mekanized:block/cardboard_box_storage
    client-bound-data:
      mekanized:gear_lore: {}
      machineengine:resource_lore: {}
blocks:
  mekanized:digital_miner:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_digital_miner
      display_model: mekanized:block/display_empty/shared/p_block_models_digital_miner
    behavior:
      options:
        energy-per-block: 2000
        ticks-per-block: 10
  mekanized:seismic_vibrator:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_seismic_vibrator_1
      display_model: mekanized:block/display_empty/shared/p_block_models_seismic_vibrator_1
    behavior:
      options:
        energy-per-tick: 50
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:teleporter:
    template: mekanized:block/machine
  mekanized:teleporter_frame:
    template: mekanized:block/machine
  mekanized:qio_drive_array:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_qio_drive_array_top
      display_model: mekanized:block/display_empty/shared/p_block_qio_drive_array_top
  mekanized:qio_dashboard:
    template: mekanized:block/display_machine_facing_6
    arguments:
      display_state: mekanized_display_p_block_models_qio_dashboard
      display_model: mekanized:block/display_empty/shared/p_block_models_qio_dashboard
    behavior:
      display_rotations: north=90/0,south=90/180,east=90/90,west=90/270,up=0/0,down=180/0
  mekanized:qio_importer:
    template: mekanized:block/display_machine_facing_6
    arguments:
      display_state: mekanized_display_p_block_models_qio_bus
      display_model: mekanized:block/display_empty/shared/p_block_models_qio_bus
    behavior:
      options:
        items-per-second: 64
      display_rotation: 180
      display_rotations: north=270/180,south=270/0,east=270/270,west=270/90,up=0/0,down=180/0
  mekanized:qio_exporter:
    template: mekanized:block/display_machine_facing_6
    arguments:
      display_state: mekanized_display_p_block_models_qio_bus
      display_model: mekanized:block/display_empty/shared/p_block_models_qio_bus
    behavior:
      options:
        items-per-second: 64
      display_rotation: 180
      display_rotations: north=270/180,south=270/0,east=270/270,west=270/90,up=0/0,down=180/0