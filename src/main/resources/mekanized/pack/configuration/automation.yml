blocks:
  mekanized:digital_miner:
    template: machineengine:block/machine
    behavior:
      options:
        energy-per-block: 2000
        ticks-per-block: 10
      display_item: mekanized:display/digital_miner
    settings:
      template: mekanized:settings/transparent_machine
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_models_digital_miner
          model:
            path: mekanized:block/display_empty/shared/p_block_models_digital_miner
      variants:
        facing=east:
          appearance: default
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=west:
          appearance: default
  mekanized:seismic_vibrator:
    template: machineengine:block/machine
    behavior:
      options:
        energy-per-tick: 50
      display_item: mekanized:display/seismic_vibrator
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
    settings:
      template: mekanized:settings/transparent_machine
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_models_seismic_vibrator_1
          model:
            path: mekanized:block/display_empty/shared/p_block_models_seismic_vibrator_1
      variants:
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=east:
          appearance: default
        facing=west:
          appearance: default
  mekanized:teleporter:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    state:
      auto_state: solid
      model:
        path: mekanized:block/teleporter
  mekanized:teleporter_frame:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    state:
      auto_state: solid
      model:
        path: mekanized:block/teleporter_frame
  mekanized:qio_drive_array:
    template: machineengine:block/machine
    behavior:
      display_item: mekanized:display/qio_drive_array
    settings:
      template: mekanized:settings/transparent_machine
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_qio_drive_array_top
          model:
            path: mekanized:block/display_empty/shared/p_block_qio_drive_array_top
      variants:
        facing=east:
          appearance: default
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=west:
          appearance: default
  mekanized:qio_dashboard:
    template: machineengine:block/machine
    behavior:
      display_item: mekanized:display/qio_dashboard
      display_rotations: north=90/0,south=90/180,east=90/90,west=90/270,up=0/0,down=180/0
    settings:
      template: mekanized:settings/transparent_machine
    states:
      properties:
        facing:
          type: 6-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_models_qio_dashboard
          model:
            path: mekanized:block/display_empty/shared/p_block_models_qio_dashboard
      variants:
        facing=up:
          appearance: default
        facing=down:
          appearance: default
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=east:
          appearance: default
        facing=west:
          appearance: default
  mekanized:qio_importer:
    template: machineengine:block/machine
    behavior:
      options:
        items-per-second: 64
      display_item: mekanized:display/qio_importer
      display_rotation: 180
      display_rotations: north=270/180,south=270/0,east=270/270,west=270/90,up=0/0,down=180/0
    settings:
      template: mekanized:settings/transparent_machine
    states:
      properties:
        facing:
          type: 6-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_models_qio_bus
          model:
            path: mekanized:block/display_empty/shared/p_block_models_qio_bus
      variants:
        facing=up:
          appearance: default
        facing=down:
          appearance: default
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=east:
          appearance: default
        facing=west:
          appearance: default
  mekanized:qio_exporter:
    template: machineengine:block/machine
    behavior:
      options:
        items-per-second: 64
      display_item: mekanized:display/qio_exporter
      display_rotation: 180
      display_rotations: north=270/180,south=270/0,east=270/270,west=270/90,up=0/0,down=180/0
    settings:
      template: mekanized:settings/transparent_machine
    states:
      properties:
        facing:
          type: 6-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_models_qio_bus
          model:
            path: mekanized:block/display_empty/shared/p_block_models_qio_bus
      variants:
        facing=up:
          appearance: default
        facing=down:
          appearance: default
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=east:
          appearance: default
        facing=west:
          appearance: default
