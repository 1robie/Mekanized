blocks:
  mekanized:digital_miner:
    behavior:
      type: machineengine:machine
      machine: mekanized:digital_miner
      keep_contents: true
      display_item: mekanized:display/digital_miner
    loot:
      template: default:loot_table/self
    settings:
      template: default:settings/transparent_1x1x1
      overrides:
        hardness: 3.5
        resistance: 8.0
        push_reaction: block
        tags:
        - minecraft:mineable/pickaxe
        correct_tools:
        - '#minecraft:pickaxes'
        required_break_power: 1
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_models_digital_miner
          model:
            path: mekanized:block/display_empty/shared/p_block_models_digital_miner
      variants:
        facing=east:
          appearance: default
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=west:
          appearance: default
