# Mekanized machines, generators, energy cubes, cables and upgrades (Phase 2), based on Mekanism (MIT).
items:
  mekanized:display/metallurgic_infuser:
    model: mekanized:block/metallurgic_infuser
  mekanized:metallurgic_infuser:
    template: mekanized:item/block_item
  mekanized:display/heat_generator:
    model: mekanized:block/heat_generator
  mekanized:display/heat_generator/active:
    model: mekanized:block/heat_generator_active
  mekanized:heat_generator:
    template: mekanized:item/block_item
  mekanized:display/solar_generator:
    model: mekanized:block/solar_generator
  mekanized:solar_generator:
    template: mekanized:item/block_item
    arguments:
      model: mekanized:item/solar_generator
  mekanized:display/bio_generator:
    model: mekanized:block/bio_generator
  mekanized:bio_generator:
    template: mekanized:item/block_item
  mekanized:upgrade_speed:
    template: mekanized:item/named
  mekanized:upgrade_energy:
    template: mekanized:item/named
  mekanized:solar_panel:
    template: mekanized:item/named
blocks:
  mekanized:metallurgic_infuser:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_steel_casing
      display_model: mekanized:block/display_empty/shared/p_block_steel_casing
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:heat_generator:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_model_heat_generator
      display_model: mekanized:block/display_empty/shared/p_block_model_heat_generator
    behavior:
      options:
        energy-per-tick: 200
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:solar_generator:
    template: mekanized:block/display_machine
    arguments:
      display_state: mekanized_display_p_block_model_solar_generator
      display_model: mekanized:block/display_empty/shared/p_block_model_solar_generator
    behavior:
      options:
        energy-per-tick: 50
  mekanized:bio_generator:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_model_bio_generator2
      display_model: mekanized:block/display_empty/shared/p_block_model_bio_generator2
    behavior:
      options:
        energy-per-tick: 350
      display_rotation: 180
      display_rotations: north=0/180,south=0/0,east=0/270,west=0/90
# Universal cables: one row per block. A row's rate is the block's (D34): what one block passes per tick.
# Each row makes the block, its item and the 19 parts display entities draw it with
# (mekanized:cable_part/<transport>/<part>); see docs/CE_TEMPLATES_PLAN.md.
config_factory#energy_transports:
  instances:
  - transport: basic_universal_cable
    rate: 8000
  - transport: advanced_universal_cable
    rate: 128000
  - transport: elite_universal_cable
    rate: 1024000
  - transport: ultimate_universal_cable
    rate: 8192000
  blueprint:
    items:
      mekanized:${transport}:
        data:
          item_name: <!i><lang:block.mekanized.${transport}>
        model: mekanized:block/cable/${transport}/center
        behavior:
          type: block_item
          block: mekanized:${transport}
      mekanized:cable_part/${transport}/center:
        model: mekanized:block/cable/${transport}/center
      mekanized:cable_part/${transport}/north:
        model: mekanized:block/cable/${transport}/north
      mekanized:cable_part/${transport}/north_pull:
        model: mekanized:block/cable/${transport}/north_pull
      mekanized:cable_part/${transport}/north_push:
        model: mekanized:block/cable/${transport}/north_push
      mekanized:cable_part/${transport}/south:
        model: mekanized:block/cable/${transport}/south
      mekanized:cable_part/${transport}/south_pull:
        model: mekanized:block/cable/${transport}/south_pull
      mekanized:cable_part/${transport}/south_push:
        model: mekanized:block/cable/${transport}/south_push
      mekanized:cable_part/${transport}/east:
        model: mekanized:block/cable/${transport}/east
      mekanized:cable_part/${transport}/east_pull:
        model: mekanized:block/cable/${transport}/east_pull
      mekanized:cable_part/${transport}/east_push:
        model: mekanized:block/cable/${transport}/east_push
      mekanized:cable_part/${transport}/west:
        model: mekanized:block/cable/${transport}/west
      mekanized:cable_part/${transport}/west_pull:
        model: mekanized:block/cable/${transport}/west_pull
      mekanized:cable_part/${transport}/west_push:
        model: mekanized:block/cable/${transport}/west_push
      mekanized:cable_part/${transport}/up:
        model: mekanized:block/cable/${transport}/up
      mekanized:cable_part/${transport}/up_pull:
        model: mekanized:block/cable/${transport}/up_pull
      mekanized:cable_part/${transport}/up_push:
        model: mekanized:block/cable/${transport}/up_push
      mekanized:cable_part/${transport}/down:
        model: mekanized:block/cable/${transport}/down
      mekanized:cable_part/${transport}/down_pull:
        model: mekanized:block/cable/${transport}/down_pull
      mekanized:cable_part/${transport}/down_push:
        model: mekanized:block/cable/${transport}/down_push
    blocks:
      mekanized:${transport}:
        template: mekanized:block/transport
        behavior:
          rate: ${rate}

# Energy cubes. One row per tier. A row's behavior holds that block's numbers (D34: storages,
# ports), merged into what the family template gives; the creative tier has none.
# Each row makes the block (template mekanized:block/energy_cube), its item and its display items.
config_factory#energy_cubes:
  instances:
  - tier: basic
    behavior:
      storages:
        energy: { capacity: 4000000 }
      ports:
        out: { rate: 4000 }
  - tier: advanced
    behavior:
      storages:
        energy: { capacity: 16000000 }
      ports:
        out: { rate: 16000 }
  - tier: elite
    behavior:
      storages:
        energy: { capacity: 64000000 }
      ports:
        out: { rate: 64000 }
  - tier: ultimate
    behavior:
      storages:
        energy: { capacity: 256000000 }
      ports:
        out: { rate: 256000 }
  - tier: creative
    behavior: {}
  blueprint:
    items:
      mekanized:${tier}_energy_cube:
        data:
          item_name: <!i><lang:block.mekanized.${tier}_energy_cube>
        model: mekanized:block/energy_cube/${tier}
        behavior:
          type: block_item
          block: mekanized:${tier}_energy_cube
      mekanized:display/${tier}_energy_cube:
        model: mekanized:block/energy_cube/${tier}/frame
      mekanized:display/energy_core/${tier}/1:
        model: mekanized:block/energy_core/${tier}/1
      mekanized:display/energy_core/${tier}/2:
        model: mekanized:block/energy_core/${tier}/2
      mekanized:display/energy_core/${tier}/3:
        model: mekanized:block/energy_core/${tier}/3
      mekanized:display/energy_core/${tier}/4:
        model: mekanized:block/energy_core/${tier}/4
      mekanized:display/${tier}_energy_cube/port/front:
        model: mekanized:block/energy_cube/${tier}/port_front
      mekanized:display/${tier}_energy_cube/port/back:
        model: mekanized:block/energy_cube/${tier}/port_back
      mekanized:display/${tier}_energy_cube/port/left:
        model: mekanized:block/energy_cube/${tier}/port_left
      mekanized:display/${tier}_energy_cube/port/right:
        model: mekanized:block/energy_cube/${tier}/port_right
      mekanized:display/${tier}_energy_cube/port/top:
        model: mekanized:block/energy_cube/${tier}/port_top
      mekanized:display/${tier}_energy_cube/port/bottom:
        model: mekanized:block/energy_cube/${tier}/port_bottom
    blocks:
      mekanized:${tier}_energy_cube:
        template: mekanized:block/energy_cube
        arguments:
          tier: ${tier}
        behavior: ${behavior}

# The basic machines: one row per block, each makes the block and its item. They turn to face the
# player and show their working model (block/<machine>_active) while they run.
config_factory#basic_machines:
  instances:
  - machine: enrichment_chamber
  - machine: crusher
  - machine: energized_smelter
  - machine: osmium_compressor
  - machine: combiner
  - machine: purification_chamber
  - machine: precision_sawmill
  blueprint:
    items:
      mekanized:${machine}:
        data:
          item_name: <!i><lang:block.mekanized.${machine}>
        model: mekanized:block/${machine}
        behavior:
          type: block_item
          block: mekanized:${machine}
    blocks:
      mekanized:${machine}:
        template: mekanized:block/machine_facing_active
