blocks:
  mekanized:enrichment_chamber:
    behavior:
      type: machineengine:machine
      machine: mekanized:enrichment_chamber
      keep_contents: true
    loot:
      template: default:loot_table/self
    settings:
      template: default:settings/solid_1x1x1
      overrides:
        hardness: 3.5
        resistance: 8.0
        push_reaction: block
        tags:
        - minecraft:mineable/pickaxe
        correct_tools:
        - '#minecraft:pickaxes'
        required_break_power: 1
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        active:
          type: boolean
          default: false
      appearances:
        facing_north_active_false:
          auto_state: solid
          model:
            path: mekanized:block/enrichment_chamber
        facing_south_active_false:
          auto_state: solid
          model:
            path: mekanized:block/enrichment_chamber
            y: 180
        facing_east_active_false:
          auto_state: solid
          model:
            path: mekanized:block/enrichment_chamber
            y: 90
        facing_west_active_false:
