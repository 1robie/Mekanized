blocks:
  mekanized:resistive_heater:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_resistive_heater_sides_2
      display_model: mekanized:block/display_empty/shared/p_block_models_resistive_heater_sides_2
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:fuelwood_heater:
    template: mekanized:block/machine_facing_active
    behavior:
      options:
        heat-per-tick: 400
  mekanized:boiler_casing:
    template: mekanized:block/machine
    behavior:
      options:
        heat-per-mb: 50
        boil-per-element: 320
        water-per-block: 16000
        steam-per-block: 160000
        heat-per-block: 1000000
        superheated-sodium-per-block: 16000
        sodium-per-block: 16000
  mekanized:boiler_valve:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    states:
      properties:
        mode:
          type: string
          values:
          - input
          - output_steam
          - output_coolant
          default: input
      appearances:
        mode_input:
          auto_state: solid
          model:
            path: mekanized:block/boiler_valve_input
        mode_output_steam:
          auto_state: solid
          model:
            path: mekanized:block/boiler_valve_output_steam
        mode_output_coolant:
          auto_state: solid
          model:
            path: mekanized:block/boiler_valve_output_coolant
      variants:
        mode=input:
          appearance: mode_input
        mode=output_steam:
          appearance: mode_output_steam
        mode=output_coolant:
          appearance: mode_output_coolant
  mekanized:pressure_disperser:
    template: mekanized:block/machine
  mekanized:superheating_element:
    template: mekanized:block/machine_active
  mekanized:turbine_casing:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/turbine/casing
    behavior:
      options:
        steam-energy: 10.0
        full-blades: 28
        blades-per-coil: 4
        vent-flow: 32000
        condenser-rate: 64000
        steam-per-block: 64000
        energy-per-block: 16000000
  mekanized:turbine_valve:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/turbine/valve
  mekanized:turbine_vent:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/turbine/vent
  mekanized:turbine_rotor:
    template: mekanized:block/display_machine
    arguments:
      display_state: mekanized_display_p_block_turbine_rotor
      display_model: mekanized:block/display_empty/shared/p_block_turbine_rotor
  mekanized:rotational_complex:
    template: mekanized:block/machine
  mekanized:electromagnetic_coil:
    template: mekanized:block/machine
  mekanized:saturating_condenser:
    template: mekanized:block/machine
  mekanized:fission_reactor_casing:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/fission/casing
    behavior:
      options:
        heat-per-mb-burned: 1000000
        coolant-heat-per-mb: 50
        fuel-per-assembly: 8000
        waste-per-assembly: 8000
        water-per-assembly: 100000
        sodium-per-assembly: 100000
        steam-per-assembly: 1000000
        superheated-sodium-per-assembly: 1000000
  mekanized:fission_reactor_port:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    states:
      properties:
        mode:
          type: string
          values:
          - input
          - output_coolant
          - output_waste
          default: input
      appearances:
        mode_input:
          auto_state: solid
          model:
            path: mekanized:block/fission/port_input
        mode_output_coolant:
          auto_state: solid
          model:
            path: mekanized:block/fission/port_output_coolant
        mode_output_waste:
          auto_state: solid
          model:
            path: mekanized:block/fission/port_output_waste
      variants:
        mode=input:
          appearance: mode_input
        mode=output_coolant:
          appearance: mode_output_coolant
        mode=output_waste:
          appearance: mode_output_waste
  mekanized:fission_reactor_logic_adapter:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/fission/logic_adapter
  mekanized:reactor_glass:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/transparent_machine
    state:
      auto_state: tintable_leaves
      model:
        path: mekanized:block/reactor_glass
  mekanized:fission_fuel_assembly:
    template: mekanized:block/display_machine
    arguments:
      display_state: mekanized_display_p_block_model_fuel_assembly_fuel_rod_assembly_side
      display_model: mekanized:block/display_empty/shared/p_block_model_fuel_assembly_fuel_rod_assembly_side
  mekanized:control_rod_assembly:
    template: mekanized:block/display_machine
    arguments:
      display_state: mekanized_display_p_block_model_fuel_assembly_fuel_rod_assembly_side
      display_model: mekanized:block/display_empty/shared/p_block_model_fuel_assembly_fuel_rod_assembly_side
  mekanized:fusion_reactor_controller:
    template: mekanized:block/machine_active
    arguments:
      model: mekanized:block/fusion/controller
      active_model: mekanized:block/fusion/controller_on
  mekanized:fusion_reactor_frame:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/fusion/frame
    behavior:
      options:
        ignition-energy: 400000000
        energy-per-mb: 200000
        fuel-tank: 10000
        energy-buffer: 1000000000
  mekanized:fusion_reactor_port:
    template: mekanized:block/machine_active
    arguments:
      model: mekanized:block/fusion/port
      active_model: mekanized:block/fusion/port_output
  mekanized:fusion_reactor_logic_adapter:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/fusion/logic_adapter
  mekanized:laser_focus_matrix:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/fusion/laser_focus_matrix
  mekanized:sps_casing:
    template: mekanized:block/machine
    behavior:
      options:
        polonium-per-antimatter: 1000
        energy-per-polonium: 1000000
        polonium-tank: 10000
        antimatter-tank: 1000
        energy-buffer: 2000000000
  mekanized:sps_port:
    template: mekanized:block/machine_active
    arguments:
      active_model: mekanized:block/sps_port_output
  mekanized:supercharged_coil:
    template: mekanized:block/display_machine_facing_6
    arguments:
      display_state: mekanized_display_p_block_steel_casing
      display_model: mekanized:block/display_empty/shared/p_block_steel_casing
    behavior:
      display_rotation: 180
      display_rotations: north=270/180,south=270/0,east=270/270,west=270/90,up=0/0,down=180/0
# Thermodynamic conductors: one row per block. A row's rate is the block's (D34): what one block passes per tick.
# Each row makes the block, its item and the 19 parts display entities draw it with
# (mekanized:cable_part/<transport>/<part>); see docs/CE_TEMPLATES_PLAN.md.
config_factory#heat_transports:
  instances:
  - transport: basic_thermodynamic_conductor
    rate: 10000
  - transport: advanced_thermodynamic_conductor
    rate: 40000
  - transport: elite_thermodynamic_conductor
    rate: 160000
  - transport: ultimate_thermodynamic_conductor
    rate: 640000
  blueprint:
    items:
      mekanized:${transport}:
        data:
          item_name: <!i><lang:block.mekanized.${transport}>
        model: mekanized:block/cable/${transport}/center
        behavior:
          type: block_item
          block: mekanized:${transport}
      mekanized:cable_part/${transport}/center:
        model: mekanized:block/cable/${transport}/center
      mekanized:cable_part/${transport}/north:
        model: mekanized:block/cable/${transport}/north
      mekanized:cable_part/${transport}/north_pull:
        model: mekanized:block/cable/${transport}/north_pull
      mekanized:cable_part/${transport}/north_push:
        model: mekanized:block/cable/${transport}/north_push
      mekanized:cable_part/${transport}/south:
        model: mekanized:block/cable/${transport}/south
      mekanized:cable_part/${transport}/south_pull:
        model: mekanized:block/cable/${transport}/south_pull
      mekanized:cable_part/${transport}/south_push:
        model: mekanized:block/cable/${transport}/south_push
      mekanized:cable_part/${transport}/east:
        model: mekanized:block/cable/${transport}/east
      mekanized:cable_part/${transport}/east_pull:
        model: mekanized:block/cable/${transport}/east_pull
      mekanized:cable_part/${transport}/east_push:
        model: mekanized:block/cable/${transport}/east_push
      mekanized:cable_part/${transport}/west:
        model: mekanized:block/cable/${transport}/west
      mekanized:cable_part/${transport}/west_pull:
        model: mekanized:block/cable/${transport}/west_pull
      mekanized:cable_part/${transport}/west_push:
        model: mekanized:block/cable/${transport}/west_push
      mekanized:cable_part/${transport}/up:
        model: mekanized:block/cable/${transport}/up
      mekanized:cable_part/${transport}/up_pull:
        model: mekanized:block/cable/${transport}/up_pull
      mekanized:cable_part/${transport}/up_push:
        model: mekanized:block/cable/${transport}/up_push
      mekanized:cable_part/${transport}/down:
        model: mekanized:block/cable/${transport}/down
      mekanized:cable_part/${transport}/down_pull:
        model: mekanized:block/cable/${transport}/down_pull
      mekanized:cable_part/${transport}/down_push:
        model: mekanized:block/cable/${transport}/down_push
    blocks:
      mekanized:${transport}:
        template: mekanized:block/transport
        behavior:
          rate: ${rate}
