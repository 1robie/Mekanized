blocks:
  mekanized:resistive_heater:
    behavior:
      type: machineengine:machine
      machine: mekanized:resistive_heater
      keep_contents: true
      display_item: mekanized:display/resistive_heater
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
    loot:
      template: machineengine:loot_table/keep_contents
    settings:
      template: default:settings/transparent_1x1x1
      overrides:
        hardness: 3.5
        resistance: 8.0
        push_reaction: block
        tags:
        - minecraft:mineable/pickaxe
        correct_tools:
        - '#minecraft:pickaxes'
        required_break_power: 1
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_models_resistive_heater_sides_2
          model:
            path: mekanized:block/display_empty/shared/p_block_models_resistive_heater_sides_2
      variants:
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=east:
          appearance: default
        facing=west:
          appearance: default
  mekanized:fuelwood_heater:
    behavior:
      type: machineengine:machine
      machine: mekanized:fuelwood_heater
      keep_contents: true
    loot:
      template: machineengine:loot_table/keep_contents
    settings:
      template: default:settings/solid_1x1x1
      overrides:
        hardness: 3.5
        resistance: 8.0
        push_reaction: block
        tags:
        - minecraft:mineable/pickaxe
        correct_tools:
        - '#minecraft:pickaxes'
        required_break_power: 1
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        active:
          type: boolean
          default: false
      appearances:
        facing_north_active_false:
          auto_state: solid
          model:
            path: mekanized:block/fuelwood_heater
        facing_south_active_false:
          auto_state: solid
          model:
            path: mekanized:block/fuelwood_heater
            y: 180
        facing_east_active_false:
          auto_state: solid
          model:
            path: mekanized:block/fuelwood_heater
            y: 90
        facing_west_active_false:
          auto_state: solid
          model:
            path: mekanized:block/fuelwood_heater
            y: 270
        facing_north_active_true:
          auto_state: solid
          model:
            path: mekanized:block/fuelwood_heater_active
        facing_south_active_true:
          auto_state: solid
          model:
            path: mekanized:block/fuelwood_heater_active
            y: 180
        facing_east_active_true:
          auto_state: solid
          model:
            path: mekanized:block/fuelwood_heater_active
            y: 90
        facing_west_active_true:
          auto_state: solid
          model:
            path: mekanized:block/fuelwood_heater_active
            y: 270
      variants:
        facing=north,active=false:
          appearance: facing_north_active_false
        facing=south,active=false:
          appearance: facing_south_active_false
        facing=east,active=false:
          appearance: facing_east_active_false
        facing=west,active=false:
          appearance: facing_west_active_false
        facing=north,active=true:
          appearance: facing_north_active_true
        facing=south,active=true:
          appearance: facing_south_active_true
        facing=east,active=true:
          appearance: facing_east_active_true
        facing=west,active=true:
          appearance: facing_west_active_true
  mekanized:boiler_casing:
    behavior:
      type: machineengine:machine
      machine: mekanized:boiler_casing
      keep_contents: true
    loot:
      template: machineengine:loot_table/keep_contents
    settings:
      template: default:settings/solid_1x1x1
      overrides:
        hardness: 3.5
        resistance: 8.0
        push_reaction: block
        tags:
        - minecraft:mineable/pickaxe
        correct_tools:
        - '#minecraft:pickaxes'
        required_break_power: 1
    state:
      auto_state: solid
      model:
