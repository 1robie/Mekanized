# Mekanized machines_shaped recipes for CraftEngine, based on Mekanism (MIT, see LICENSE-MEKANISM.txt).
recipes:
  mekanized:combiner:
    type: shaped
    pattern:
    - ACA
    - _X_
    - ACA
    ingredients:
      A: '#mekanized:alloys/reinforced'
      C: '#c:circuits/elite'
      X: mekanized:steel_casing
      _:
      - '#minecraft:stone_crafting_materials'
      - minecraft:cobblestone
    result:
      id: mekanized:combiner
      count: 1
  mekanized:crusher:
    type: shaped
    pattern:
    - RCR
    - BXB
    - RCR
    ingredients:
      B: minecraft:lava_bucket
      C: '#c:circuits/basic'
      R: minecraft:redstone
      X: mekanized:steel_casing
    result:
      id: mekanized:crusher
      count: 1
  mekanized:energized_smelter:
    type: shaped
    pattern:
    - ACA
    - GXG
    - ACA
    ingredients:
      A: minecraft:redstone
      C: '#c:circuits/basic'
      G: minecraft:glass
      X: mekanized:steel_casing
    result:
      id: mekanized:energized_smelter
      count: 1
  mekanized:enrichment_chamber:
    type: shaped
    pattern:
    - ACA
    - IXI
    - ACA
    ingredients:
      A: minecraft:redstone
      C: '#c:circuits/basic'
      I: minecraft:iron_ingot
      X: mekanized:steel_casing
    result:
      id: mekanized:enrichment_chamber
      count: 1
  mekanized:generator/bio:
    type: shaped
    pattern:
    - RAR
    - BCB
    - IAI
    ingredients:
      A: '#mekanized:alloys/infused'
      B: '#c:fuels/bio'
      C: '#c:circuits/basic'
      I: minecraft:iron_ingot
      R: minecraft:redstone
    result:
      id: mekanized:bio_generator
      count: 1
  mekanized:generator/heat:
    type: shaped
    pattern:
    - III
    - WOW
    - CFC
    ingredients:
      C: minecraft:copper_ingot
      F: minecraft:furnace
      I: minecraft:iron_ingot
      O: '#c:ingots/osmium'
      W: '#minecraft:planks'
    result:
      id: mekanized:heat_generator
      count: 1
  mekanized:metallurgic_infuser:
    type: shaped
    pattern:
    - I#I
    - ROR
    - I#I
    ingredients:
      '#': minecraft:furnace
      I: minecraft:iron_ingot
      O: '#c:ingots/osmium'
      R: minecraft:redstone
