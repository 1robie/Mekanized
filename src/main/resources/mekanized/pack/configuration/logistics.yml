# Logistical transporters: one row per block. A row's rate is the block's (D34): what one block passes per tick.
# Each row makes the block, its item and the 19 parts display entities draw it with
# (mekanized:cable_part/<transport>/<part>); see docs/CE_TEMPLATES_PLAN.md.
config_factory#item_transports:
  instances:
  - transport: basic_logistical_transporter
    rate: 8
  - transport: advanced_logistical_transporter
    rate: 16
  - transport: elite_logistical_transporter
    rate: 32
  - transport: ultimate_logistical_transporter
    rate: 64
  blueprint:
    items:
      mekanized:${transport}:
        data:
