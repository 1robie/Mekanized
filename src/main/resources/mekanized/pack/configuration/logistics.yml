# Mekanized transporters, the logistical sorter, factories, tier installers and the configurator (Phase 4), based on Mekanism (MIT).
items:
  mekanized:display/logistical_sorter:
    model: mekanized:block/logistical_sorter
  mekanized:display/logistical_sorter/active:
    model: mekanized:block/logistical_sorter_active
  mekanized:logistical_sorter:
    data:
      item_name: <!i><lang:block.mekanized.logistical_sorter>
    model: mekanized:block/logistical_sorter
    behavior:
      type: block_item
      block: mekanized:logistical_sorter
  mekanized:basic_tier_installer:
    behaviors:
    - type: mekanized:tier_installer
      tier: basic
    data:
      item_name: <!i><lang:item.mekanized.basic_tier_installer>
    model: mekanized:item/basic_tier_installer
  mekanized:advanced_tier_installer:
    behaviors:
    - type: mekanized:tier_installer
      tier: advanced
    data:
      item_name: <!i><lang:item.mekanized.advanced_tier_installer>
    model: mekanized:item/advanced_tier_installer
  mekanized:elite_tier_installer:
    behaviors:
    - type: mekanized:tier_installer
      tier: elite
    data:
      item_name: <!i><lang:item.mekanized.elite_tier_installer>
    model: mekanized:item/elite_tier_installer
  mekanized:ultimate_tier_installer:
    behaviors:
    - type: mekanized:tier_installer
      tier: ultimate
    data:
      item_name: <!i><lang:item.mekanized.ultimate_tier_installer>
    model: mekanized:item/ultimate_tier_installer
  mekanized:configurator:
    behaviors:
    - type: machineengine:wrench
      sneak-click: rotate
    - type: mekanized:configurator
    data:
      item_name: <!i><lang:item.mekanized.configurator>
    model: mekanized:item/configurator
    settings:
      tags:
      - c:tools/wrench
      - mekanized:configurators
blocks:
  mekanized:logistical_sorter:
    template: mekanized:block/display_machine_facing_6
    arguments:
      display_state: mekanized_display_p_block_models_logistical_sorter
      display_model: mekanized:block/display_empty/shared/p_block_models_logistical_sorter
    behavior:
      options:
        every-ticks: 10
        stack-size: 64
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270,up=270/0,down=90/0
# Logistical transporters: one row per block. A row's rate is the block's (D34): what one block passes per tick.
# Each row makes the block, its item and the 19 parts display entities draw it with
# (mekanized:cable_part/<transport>/<part>); see docs/CE_TEMPLATES_PLAN.md.
config_factory#item_transports:
  instances:
  - transport: basic_logistical_transporter
    rate: 8
  - transport: advanced_logistical_transporter
    rate: 16
  - transport: elite_logistical_transporter
    rate: 32
  - transport: ultimate_logistical_transporter
    rate: 64
  blueprint:
    items:
      mekanized:${transport}:
        data:
          item_name: <!i><lang:block.mekanized.${transport}>
        model: mekanized:block/cable/${transport}/center
        behavior:
          type: block_item
          block: mekanized:${transport}
      mekanized:cable_part/${transport}/center:
        model: mekanized:block/cable/${transport}/center
      mekanized:cable_part/${transport}/north:
        model: mekanized:block/cable/${transport}/north
      mekanized:cable_part/${transport}/north_pull:
        model: mekanized:block/cable/${transport}/north_pull
      mekanized:cable_part/${transport}/north_push:
        model: mekanized:block/cable/${transport}/north_push
      mekanized:cable_part/${transport}/south:
        model: mekanized:block/cable/${transport}/south
      mekanized:cable_part/${transport}/south_pull:
        model: mekanized:block/cable/${transport}/south_pull
      mekanized:cable_part/${transport}/south_push:
        model: mekanized:block/cable/${transport}/south_push
      mekanized:cable_part/${transport}/east:
        model: mekanized:block/cable/${transport}/east
      mekanized:cable_part/${transport}/east_pull:
        model: mekanized:block/cable/${transport}/east_pull
      mekanized:cable_part/${transport}/east_push:
        model: mekanized:block/cable/${transport}/east_push
      mekanized:cable_part/${transport}/west:
        model: mekanized:block/cable/${transport}/west
      mekanized:cable_part/${transport}/west_pull:
        model: mekanized:block/cable/${transport}/west_pull
      mekanized:cable_part/${transport}/west_push:
        model: mekanized:block/cable/${transport}/west_push
      mekanized:cable_part/${transport}/up:
        model: mekanized:block/cable/${transport}/up
      mekanized:cable_part/${transport}/up_pull:
        model: mekanized:block/cable/${transport}/up_pull
      mekanized:cable_part/${transport}/up_push:
        model: mekanized:block/cable/${transport}/up_push
      mekanized:cable_part/${transport}/down:
        model: mekanized:block/cable/${transport}/down
      mekanized:cable_part/${transport}/down_pull:
        model: mekanized:block/cable/${transport}/down_pull
      mekanized:cable_part/${transport}/down_push:
        model: mekanized:block/cable/${transport}/down_push
    blocks:
      mekanized:${transport}:
        template: mekanized:block/transport
        behavior:
          rate: ${rate}

# Factories: one row per block (kind, tier). Each row makes the block, its item and its two
# display items (idle and working). Factories of one kind share a visual state. Their process
# lanes (3, 5, 7, 9 by tier) are structural, kept in Java.
config_factory#factories:
  instances:
  - { kind: smelting, tier: basic }
  - { kind: smelting, tier: advanced }
  - { kind: smelting, tier: elite }
  - { kind: smelting, tier: ultimate }
  - { kind: enriching, tier: basic }
  - { kind: enriching, tier: advanced }
  - { kind: enriching, tier: elite }
  - { kind: enriching, tier: ultimate }
  - { kind: crushing, tier: basic }
  - { kind: crushing, tier: advanced }
  - { kind: crushing, tier: elite }
  - { kind: crushing, tier: ultimate }
  - { kind: compressing, tier: basic }
  - { kind: compressing, tier: advanced }
  - { kind: compressing, tier: elite }
  - { kind: compressing, tier: ultimate }
  - { kind: combining, tier: basic }
  - { kind: combining, tier: advanced }
  - { kind: combining, tier: elite }
  - { kind: combining, tier: ultimate }
  - { kind: purifying, tier: basic }
  - { kind: purifying, tier: advanced }
  - { kind: purifying, tier: elite }
  - { kind: purifying, tier: ultimate }
  - { kind: injecting, tier: basic }
  - { kind: injecting, tier: advanced }
  - { kind: injecting, tier: elite }
  - { kind: injecting, tier: ultimate }
  - { kind: infusing, tier: basic }
  - { kind: infusing, tier: advanced }
  - { kind: infusing, tier: elite }
  - { kind: infusing, tier: ultimate }
  - { kind: sawing, tier: basic }
  - { kind: sawing, tier: advanced }
  - { kind: sawing, tier: elite }
  - { kind: sawing, tier: ultimate }
  blueprint:
    items:
      mekanized:${tier}_${kind}_factory:
        data:
          item_name: <!i><lang:block.mekanized.${tier}_${kind}_factory>
        model: mekanized:block/factory/${kind}/${tier}
        behavior:
          type: block_item
          block: mekanized:${tier}_${kind}_factory
      mekanized:display/${tier}_${kind}_factory:
        model: mekanized:block/factory/${kind}/${tier}
      mekanized:display/${tier}_${kind}_factory/active:
        model: mekanized:block/factory/${kind}/active/${tier}
    blocks:
      mekanized:${tier}_${kind}_factory:
        template: mekanized:block/display_machine_facing
        arguments:
          display_state: mekanized_${kind}_factory
          display_model: mekanized:block/display_empty/${kind}_factory
        behavior:
          display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
