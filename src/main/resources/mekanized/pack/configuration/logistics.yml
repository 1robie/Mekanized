blocks:
  mekanized:logistical_sorter:
    template: machineengine:block/machine
    behavior:
      options:
        every-ticks: 10
        stack-size: 64
      display_item: mekanized:display/logistical_sorter
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270,up=270/0,down=90/0
    settings:
      template: mekanized:settings/transparent_machine
    states:
      properties:
        facing:
          type: 6-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_models_logistical_sorter
          model:
            path: mekanized:block/display_empty/shared/p_block_models_logistical_sorter
      variants:
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=east:
          appearance: default
        facing=west:
          appearance: default
        facing=up:
          appearance: default
        facing=down:
          appearance: default
