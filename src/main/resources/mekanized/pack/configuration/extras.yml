# Mekanized chunk loading, quantum entangloporter, the last upgrades and tools (Phase 6 wave 6), based on Mekanism (MIT).
items:
  mekanized:dimensional_stabilizer:
    data:
      item_name: <!i><lang:block.mekanized.dimensional_stabilizer>
    model: mekanized:block/dimensional_stabilizer
    behavior:
      type: block_item
      block: mekanized:dimensional_stabilizer
  mekanized:display/quantum_entangloporter:
    model: mekanized:block/quantum_entangloporter
  mekanized:quantum_entangloporter:
    data:
      item_name: <!i><lang:block.mekanized.quantum_entangloporter>
    model: mekanized:block/quantum_entangloporter
    behavior:
      type: block_item
      block: mekanized:quantum_entangloporter
  mekanized:display/radioactive_waste_barrel:
    model: mekanized:block/radioactive_waste_barrel
  mekanized:radioactive_waste_barrel:
    data:
      item_name: <!i><lang:block.mekanized.radioactive_waste_barrel>
    model: mekanized:block/radioactive_waste_barrel
    behavior:
      type: block_item
      block: mekanized:radioactive_waste_barrel
  mekanized:display/nutritional_liquifier:
    model: mekanized:block/nutritional_liquifier
  mekanized:display/nutritional_liquifier/active:
    model: mekanized:block/nutritional_liquifier_base
  mekanized:nutritional_liquifier:
    data:
      item_name: <!i><lang:block.mekanized.nutritional_liquifier>
    model: mekanized:block/nutritional_liquifier
    behavior:
      type: block_item
      block: mekanized:nutritional_liquifier
  mekanized:display/modification_station:
    model: mekanized:block/modification_station
  mekanized:modification_station:
    data:
      item_name: <!i><lang:block.mekanized.modification_station>
    model: mekanized:block/modification_station
    behavior:
      type: block_item
      block: mekanized:modification_station
  mekanized:upgrade_chemical:
    data:
      item_name: <!i><lang:item.mekanized.upgrade_chemical>
    model: mekanized:item/upgrade_chemical
  mekanized:upgrade_filter:
    data:
      item_name: <!i><lang:item.mekanized.upgrade_filter>
    model: mekanized:item/upgrade_filter
  mekanized:upgrade_anchor:
    data:
      item_name: <!i><lang:item.mekanized.upgrade_anchor>
    model: mekanized:item/upgrade_anchor
  mekanized:upgrade_stone_generator:
    data:
      item_name: <!i><lang:item.mekanized.upgrade_stone_generator>
    model: mekanized:item/upgrade_stone_generator
  mekanized:dosimeter:
    behaviors:
    - type: mekanized:radiation_reader
      mode: dose
    data:
      item_name: <!i><lang:item.mekanized.dosimeter>
    model: mekanized:item/dosimeter
  mekanized:geiger_counter:
    behaviors:
    - type: mekanized:radiation_reader
      mode: environment
    data:
      item_name: <!i><lang:item.mekanized.geiger_counter>
    model: mekanized:item/geiger_counter
blocks:
  mekanized:dimensional_stabilizer:
    template: mekanized:block/machine_active
    behavior:
      options:
        energy-per-chunk: 500
  mekanized:quantum_entangloporter:
    template: mekanized:block/display_machine_facing_6
    arguments:
      display_state: mekanized_display_p_block_models_quantum_entangloporter
      display_model: mekanized:block/display_empty/shared/p_block_models_quantum_entangloporter
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270,up=270/0,down=90/0
  mekanized:radioactive_waste_barrel:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_radioactive_waste_barrel
      display_model: mekanized:block/display_empty/shared/p_block_models_radioactive_waste_barrel
    behavior:
      storages:
        waste: { capacity: 512000 }
      options:
        decay-per-second: 1
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:nutritional_liquifier:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_nutritional_liquifier
      display_model: mekanized:block/display_empty/shared/p_block_nutritional_liquifier
    behavior:
      options:
        ticks: 100
        energy-per-tick: 200
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
  mekanized:modification_station:
    template: mekanized:block/display_machine_facing
    arguments:
      display_state: mekanized_display_p_block_models_modification_station
      display_model: mekanized:block/display_empty/shared/p_block_models_modification_station
    behavior:
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270