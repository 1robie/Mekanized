        break_power: 1
    state:
      auto_state: solid
      model:
        path: mekanized:block/ore/tin
  mekanized:uranium_ore:
    loot:
      template: default:loot_table/ore
      arguments:
        ore_drop: mekanized:raw_uranium
        ore_block: mekanized:uranium_ore
    settings:
      template: default:settings/ore
      arguments:
        break_power: 1
    state:
      auto_state: solid
      model:
        path: mekanized:block/ore/uranium

# Blocks of a material: one row per material (mekanized:block_<material>), each makes the block
# and its item (tagged c:storage_blocks/<material>).
config_factory#storage_blocks:
  instances:
  - material: bronze
  - material: charcoal
  - material: fluorite
  - material: lead
  - material: osmium
  - material: raw_lead
  - material: raw_osmium
  - material: raw_tin
  - material: raw_uranium
  - material: refined_obsidian
  - material: steel
  - material: tin
  - material: uranium
  blueprint:
    items:
      mekanized:block_${material}:
        template: mekanized:item/block_item
        arguments:
          model: mekanized:block/storage/${material}
        settings:
          tags:
          - c:storage_blocks
          - c:storage_blocks/${material}
    blocks:
      mekanized:block_${material}:
        template: mekanized:block/storage_block
        arguments:
          model: mekanized:block/storage/${material}
