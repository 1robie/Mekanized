# Bins. One row per tier. A row's behavior holds that block's numbers (D34: storages,
# ports), merged into what the family template gives; the creative tier has none.
config_factory#bins:
  instances:
  - tier: basic
    behavior:
      storages:
        items: { capacity: 4096 }
  - tier: advanced
    behavior:
      storages:
        items: { capacity: 8192 }
  - tier: elite
    behavior:
      storages:
        items: { capacity: 32768 }
  - tier: ultimate
    behavior:
      storages:
        items: { capacity: 262144 }
  - tier: creative
    behavior: {}
  blueprint:
    items:
      mekanized:${tier}_bin:
        data:
          item_name: <!i><lang:block.mekanized.${tier}_bin>
        model: mekanized:block/bin/${tier}
        behavior:
          type: block_item
          block: mekanized:${tier}_bin
    blocks:
      mekanized:${tier}_bin:
        template: machineengine:block/machine
        behavior: ${behavior}
        settings:
          template: mekanized:settings/machine
        states:
          template: machineengine:block_state/facing_active
          arguments:
            model: mekanized:block/bin/${tier}
            active_model: mekanized:block/bin/active/${tier}
