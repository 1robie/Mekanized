blocks:
  mekanized:personal_chest:
    template: machineengine:block/machine
    behavior:
      display_item: mekanized:display/personal_chest
      display_rotations: north=0/0,south=0/180,east=0/90,west=0/270
    settings:
      template: mekanized:settings/transparent_machine
      overrides:
        resistance: 3600000.0  # personal storage: no explosion breaks it
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        default:
          auto_state:
            type: leaves
            id: mekanized_display_p_block_steel_casing
          model:
            path: mekanized:block/display_empty/shared/p_block_steel_casing
      variants:
        facing=north:
          appearance: default
        facing=south:
          appearance: default
        facing=east:
          appearance: default
        facing=west:
          appearance: default
  mekanized:personal_barrel:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
      overrides:
        resistance: 3600000.0  # personal storage: no explosion breaks it
    states:
      properties:
        facing:
          type: 6-direction
          default: north
        open:
          type: boolean
          default: false
      appearances:
        facing_down_open_false:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel
            x: 180
        facing_down_open_true:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel_open
            x: 180
        facing_east_open_false:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel
            x: 90
            y: 90
        facing_east_open_true:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel_open
            x: 90
            y: 90
        facing_north_open_false:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel
            x: 90
        facing_north_open_true:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel_open
            x: 90
        facing_south_open_false:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel
            x: 90
            y: 180
        facing_south_open_true:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel_open
            x: 90
            y: 180
        facing_up_open_false:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel
        facing_up_open_true:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel_open
        facing_west_open_false:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel
            x: 90
            y: 270
        facing_west_open_true:
          auto_state: solid
          model:
            path: mekanized:block/personal_barrel_open
            x: 90
            y: 270
      variants:
        facing=down,open=false:
          appearance: facing_down_open_false
        facing=down,open=true:
          appearance: facing_down_open_true
        facing=east,open=false:
          appearance: facing_east_open_false
        facing=east,open=true:
          appearance: facing_east_open_true
        facing=north,open=false:
          appearance: facing_north_open_false
        facing=north,open=true:
          appearance: facing_north_open_true
        facing=south,open=false:
          appearance: facing_south_open_false
        facing=south,open=true:
          appearance: facing_south_open_true
        facing=up,open=false:
          appearance: facing_up_open_false
        facing=up,open=true:
          appearance: facing_up_open_true
        facing=west,open=false:
          appearance: facing_west_open_false
        facing=west,open=true:
          appearance: facing_west_open_true
