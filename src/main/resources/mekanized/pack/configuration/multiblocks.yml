# Mekanized multiblocks: Dynamic Tank, Induction Matrix, Thermal Evaporation Plant (Phase 5a), based on Mekanism (MIT).
items:
  mekanized:dynamic_tank:
    template: mekanized:item/block_item
  mekanized:dynamic_valve:
    template: mekanized:item/block_item
  mekanized:structural_glass:
    template: mekanized:item/block_item
  mekanized:induction_casing:
    template: mekanized:item/block_item
    arguments:
      model: mekanized:block/induction/casing
  mekanized:induction_port:
    template: mekanized:item/block_item
    arguments:
      model: mekanized:block/induction/port
  mekanized:thermal_evaporation_block:
    template: mekanized:item/block_item
    arguments:
      model: mekanized:block/thermal_evaporation/block
  mekanized:thermal_evaporation_valve:
    template: mekanized:item/block_item
    arguments:
      model: mekanized:block/thermal_evaporation/valve
  mekanized:thermal_evaporation_controller:
    template: mekanized:item/block_item
    arguments:
      model: mekanized:block/thermal_evaporation/controller
blocks:
  mekanized:dynamic_tank:
    template: mekanized:block/machine
    behavior:
      options:
        fluid-per-block: 350000
        chemical-per-block: 16000000
  mekanized:dynamic_valve:
    template: mekanized:block/machine
  mekanized:structural_glass:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/transparent_machine
    state:
      auto_state: tintable_leaves
      model:
        path: mekanized:block/structural_glass
  mekanized:induction_casing:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/induction/casing
    behavior:
      options:
        cell-capacity:
          basic: 8000000000
          advanced: 64000000000
          elite: 512000000000
          ultimate: 4000000000000
  mekanized:induction_port:
    template: mekanized:block/machine_active
    arguments:
      model: mekanized:block/induction/port
      active_model: mekanized:block/induction/port_output
    behavior:
      options:
        provider-output:
          basic: 256000
          advanced: 2048000
          elite: 16384000
          ultimate: 131072000
  mekanized:thermal_evaporation_block:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/thermal_evaporation/block
    behavior:
      options:
        input-per-level-per-tick: 10
        input-tank-per-level: 16000
        output-tank: 10000
  mekanized:thermal_evaporation_valve:
    template: mekanized:block/machine
    arguments:
      model: mekanized:block/thermal_evaporation/valve
  mekanized:thermal_evaporation_controller:
    template: mekanized:block/machine_facing_active
    arguments:
      model: mekanized:block/thermal_evaporation/controller
      active_model: mekanized:block/thermal_evaporation/controller_active
# Induction cells and providers, one row per tier. They are plain blocks the induction matrix
# counts: their numbers are the matrix's options (D34).
config_factory#induction_parts:
  instances:
  - tier: basic
  - tier: advanced
  - tier: elite
  - tier: ultimate
  blueprint:
    items:
      mekanized:${tier}_induction_cell:
        data:
          item_name: <!i><lang:block.mekanized.${tier}_induction_cell>
        model: mekanized:block/induction/cell/${tier}
        behavior:
          type: block_item
          block: mekanized:${tier}_induction_cell
      mekanized:${tier}_induction_provider:
        data:
          item_name: <!i><lang:block.mekanized.${tier}_induction_provider>
        model: mekanized:block/induction/provider/${tier}
        behavior:
          type: block_item
          block: mekanized:${tier}_induction_provider
    blocks:
      mekanized:${tier}_induction_cell:
        loot:
          template: default:loot_table/self
        settings:
          template: mekanized:settings/storage_block
        state:
          auto_state: solid
          model:
            path: mekanized:block/induction/cell/${tier}
      mekanized:${tier}_induction_provider:
        loot:
          template: default:loot_table/self
        settings:
          template: mekanized:settings/storage_block
        state:
          auto_state: solid
          model:
            path: mekanized:block/induction/provider/${tier}
