blocks:
  mekanized:dynamic_tank:
    behavior:
      type: machineengine:machine
      machine: mekanized:dynamic_tank
      options:
        fluid-per-block: 350000
        chemical-per-block: 16000000
      keep_contents: true
    loot:
      template: machineengine:loot_table/keep_contents
    settings:
      template: default:settings/solid_1x1x1
      overrides:
        hardness: 3.5
        resistance: 8.0
        push_reaction: block
        tags:
        - minecraft:mineable/pickaxe
        correct_tools:
        - '#minecraft:pickaxes'
        required_break_power: 1
    state:
      auto_state: solid
      model:
        path: mekanized:block/dynamic_tank
  mekanized:dynamic_valve:
    behavior:
      type: machineengine:machine
      machine: mekanized:dynamic_valve
      keep_contents: true
    loot:
