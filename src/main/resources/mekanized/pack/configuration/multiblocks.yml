    loot:
      template: machineengine:loot_table/keep_contents
    settings:
      template: default:settings/transparent_1x1x1
      overrides:
        hardness: 3.5
        resistance: 8.0
        push_reaction: block
        tags:
        - minecraft:mineable/pickaxe
        correct_tools:
        - '#minecraft:pickaxes'
        required_break_power: 1
    state:
      auto_state: tintable_leaves
      model:
        path: mekanized:block/structural_glass
  mekanized:induction_casing:
    behavior:
      type: machineengine:machine
      machine: mekanized:induction_casing
      options:
        cell-capacity:
          basic: 8000000000
          advanced: 64000000000
          elite: 512000000000
          ultimate: 4000000000000
      keep_contents: true
    loot:
