# Mekanized multiblocks: Dynamic Tank, Induction Matrix, Thermal Evaporation Plant (Phase 5a), based on Mekanism (MIT).
items:
  mekanized:dynamic_tank:
    data:
      item_name: <!i><lang:block.mekanized.dynamic_tank>
    model: mekanized:block/dynamic_tank
    behavior:
      type: block_item
      block: mekanized:dynamic_tank
  mekanized:dynamic_valve:
    data:
      item_name: <!i><lang:block.mekanized.dynamic_valve>
    model: mekanized:block/dynamic_valve
    behavior:
      type: block_item
      block: mekanized:dynamic_valve
  mekanized:structural_glass:
    data:
      item_name: <!i><lang:block.mekanized.structural_glass>
    model: mekanized:block/structural_glass
    behavior:
      type: block_item
      block: mekanized:structural_glass
  mekanized:induction_casing:
    data:
      item_name: <!i><lang:block.mekanized.induction_casing>
    model: mekanized:block/induction/casing
    behavior:
      type: block_item
      block: mekanized:induction_casing
  mekanized:induction_port:
    data:
      item_name: <!i><lang:block.mekanized.induction_port>
    model: mekanized:block/induction/port
    behavior:
      type: block_item
      block: mekanized:induction_port
  mekanized:thermal_evaporation_block:
    data:
      item_name: <!i><lang:block.mekanized.thermal_evaporation_block>
    model: mekanized:block/thermal_evaporation/block
    behavior:
      type: block_item
      block: mekanized:thermal_evaporation_block
  mekanized:thermal_evaporation_valve:
    data:
      item_name: <!i><lang:block.mekanized.thermal_evaporation_valve>
    model: mekanized:block/thermal_evaporation/valve
    behavior:
      type: block_item
      block: mekanized:thermal_evaporation_valve
  mekanized:thermal_evaporation_controller:
    data:
      item_name: <!i><lang:block.mekanized.thermal_evaporation_controller>
    model: mekanized:block/thermal_evaporation/controller
    behavior:
      type: block_item
      block: mekanized:thermal_evaporation_controller
blocks:
  mekanized:dynamic_tank:
    template: machineengine:block/machine
    behavior:
      options:
        fluid-per-block: 350000
        chemical-per-block: 16000000
    settings:
      template: mekanized:settings/machine
    state:
      auto_state: solid
      model:
        path: mekanized:block/dynamic_tank
  mekanized:dynamic_valve:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    state:
      auto_state: solid
      model:
        path: mekanized:block/dynamic_valve
  mekanized:structural_glass:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/transparent_machine
    state:
      auto_state: tintable_leaves
      model:
        path: mekanized:block/structural_glass
  mekanized:induction_casing:
    template: machineengine:block/machine
    behavior:
      options:
        cell-capacity:
          basic: 8000000000
          advanced: 64000000000
          elite: 512000000000
          ultimate: 4000000000000
    settings:
      template: mekanized:settings/machine
    state:
      auto_state: solid
      model:
        path: mekanized:block/induction/casing
  mekanized:induction_port:
    template: machineengine:block/machine
    behavior:
      options:
        provider-output:
          basic: 256000
          advanced: 2048000
          elite: 16384000
          ultimate: 131072000
    settings:
      template: mekanized:settings/machine
    states:
      properties:
        active:
          type: boolean
          default: false
      appearances:
        active_false:
          auto_state: solid
          model:
            path: mekanized:block/induction/port
        active_true:
          auto_state: solid
          model:
            path: mekanized:block/induction/port_output
      variants:
        active=false:
          appearance: active_false
        active=true:
          appearance: active_true
  mekanized:thermal_evaporation_block:
    template: machineengine:block/machine
    behavior:
      options:
        input-per-level-per-tick: 10
        input-tank-per-level: 16000
        output-tank: 10000
    settings:
      template: mekanized:settings/machine
    state:
      auto_state: solid
      model:
        path: mekanized:block/thermal_evaporation/block
  mekanized:thermal_evaporation_valve:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    state:
      auto_state: solid
      model:
        path: mekanized:block/thermal_evaporation/valve
  mekanized:thermal_evaporation_controller:
    template: machineengine:block/machine
    settings:
      template: mekanized:settings/machine
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        active:
          type: boolean
          default: false
      appearances:
        facing_north_active_false:
          auto_state: solid
          model:
            path: mekanized:block/thermal_evaporation/controller
        facing_south_active_false:
          auto_state: solid
          model:
            path: mekanized:block/thermal_evaporation/controller
            y: 180
        facing_east_active_false:
          auto_state: solid
          model:
            path: mekanized:block/thermal_evaporation/controller
            y: 90
        facing_west_active_false:
          auto_state: solid
          model:
            path: mekanized:block/thermal_evaporation/controller
            y: 270
        facing_north_active_true:
          auto_state: solid
          model:
            path: mekanized:block/thermal_evaporation/controller_active
        facing_south_active_true:
          auto_state: solid
          model:
            path: mekanized:block/thermal_evaporation/controller_active
            y: 180
        facing_east_active_true:
          auto_state: solid
          model:
            path: mekanized:block/thermal_evaporation/controller_active
            y: 90
        facing_west_active_true:
          auto_state: solid
          model:
            path: mekanized:block/thermal_evaporation/controller_active
            y: 270
      variants:
        facing=north,active=false:
          appearance: facing_north_active_false
        facing=south,active=false:
          appearance: facing_south_active_false
        facing=east,active=false:
          appearance: facing_east_active_false
        facing=west,active=false:
          appearance: facing_west_active_false
        facing=north,active=true:
          appearance: facing_north_active_true
        facing=south,active=true:
          appearance: facing_south_active_true
        facing=east,active=true:
          appearance: facing_east_active_true
        facing=west,active=true:
          appearance: facing_west_active_true

# Induction cells and providers, one row per tier. They are plain blocks the induction matrix
# counts: their numbers are the matrix's options (D34).
config_factory#induction_parts:
  instances:
  - tier: basic
  - tier: advanced
  - tier: elite
  - tier: ultimate
  blueprint:
    items:
      mekanized:${tier}_induction_cell:
        data:
          item_name: <!i><lang:block.mekanized.${tier}_induction_cell>
        model: mekanized:block/induction/cell/${tier}
        behavior:
          type: block_item
          block: mekanized:${tier}_induction_cell
      mekanized:${tier}_induction_provider:
        data:
          item_name: <!i><lang:block.mekanized.${tier}_induction_provider>
        model: mekanized:block/induction/provider/${tier}
        behavior:
          type: block_item
          block: mekanized:${tier}_induction_provider
    blocks:
      mekanized:${tier}_induction_cell:
        loot:
          template: default:loot_table/self
        settings:
          template: mekanized:settings/storage_block
        state:
          auto_state: solid
          model:
            path: mekanized:block/induction/cell/${tier}
      mekanized:${tier}_induction_provider:
        loot:
          template: default:loot_table/self
        settings:
          template: mekanized:settings/storage_block
        state:
          auto_state: solid
          model:
            path: mekanized:block/induction/provider/${tier}
