      model:
        path: mekanized:block/induction/casing
  mekanized:induction_port:
    behavior:
      type: machineengine:machine
      machine: mekanized:induction_port
      options:
        provider-output:
          basic: 256000
          advanced: 2048000
          elite: 16384000
          ultimate: 131072000
      keep_contents: true
    loot:
      template: machineengine:loot_table/keep_contents
    settings:
      template: default:settings/solid_1x1x1
      overrides:
        hardness: 3.5
        resistance: 8.0
        push_reaction: block
        tags:
        - minecraft:mineable/pickaxe
        correct_tools:
        - '#minecraft:pickaxes'
        required_break_power: 1
    states:
      properties:
        active:
          type: boolean
          default: false
      appearances:
        active_false:
          auto_state: solid
          model:
            path: mekanized:block/induction/port
        active_true:
          auto_state: solid
          model:
            path: mekanized:block/induction/port_output
      variants:
        active=false:
          appearance: active_false
        active=true:
          appearance: active_true
