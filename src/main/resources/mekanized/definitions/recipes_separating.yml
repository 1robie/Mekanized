# Mekanized separating recipes, based on Mekanism (MIT, see LICENSE-MEKANISM.txt).
# Edit freely: updates replace this file only while it is unedited; delete it to get the defaults back.
# Durations are ticks; energy is Joules per tick. Phase 3 of MEKANIZED_PLAN.md.
recipes:
  mekanized:separator/brine:
    type: mekanized:separating
    duration: 1
    inputs:
    - type: mekanized:fluid/brine
      amount: 10
    outputs:
    - type: mekanized:sodium
      amount: 1
    - type: mekanized:chlorine
      amount: 1
    cost-per-tick:
    - type: machineengine:energy
      amount: 400
  mekanized:separator/heavy_water:
    type: mekanized:separating
    duration: 1
    inputs:
    - type: mekanized:fluid/heavy_water
      amount: 2
    outputs:
    - type: mekanized:deuterium
      amount: 2
    - type: mekanized:oxygen
      amount: 1
    cost-per-tick:
    - type: machineengine:energy
      amount: 800
  mekanized:separator/water:
    type: mekanized:separating
    duration: 1
    inputs:
    - type: machineengine:fluid/water
      amount: 2
    outputs:
    - type: mekanized:hydrogen
      amount: 2
    - type: mekanized:oxygen
      amount: 1
    cost-per-tick:
    - type: machineengine:energy
      amount: 400
